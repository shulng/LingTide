server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: LingTide
  datasource:
    url: jdbc:sqlite:./data/lingtide.db?journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    username: admin
    password: password
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  web:
    resources:
      static-locations: file:./uploads/

jwt:
  secret: LingTideVideoPlatformSecretKey2026ForJWTTokenGeneration
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

upload:
  path: ./uploads/videos
  cover-path: ./uploads/covers

logging:
  level:
    org.hibernate.SQL: WARN
    com.shulng: DEBUG
